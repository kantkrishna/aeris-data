[project]
name = "aeris-foundation"
version = "0.1.0"
description = "AERIS V1 Platform Foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.142.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "snowflake-connector-python>=4.7.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundation"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = [
    "^\\.venv",
    "^\\.mypy_cache",
    "^\\.pytest_cache"
]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*"
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas>=2.3.3",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
